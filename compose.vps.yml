# Production stack for a host that sits behind a shared edge proxy (Caddy).
# Publishes no host ports for the web tier: the proxy reaches those containers by
# name over the external "taskpart" Docker network. The mail tier publishes the
# standard SMTP/IMAP ports directly. Bring up from the repo root:
#
#   docker compose -f compose.vps.yml up -d --build
#
# Secrets come from .env in this directory (see .env.example). The mail tier
# serves the managed domains from the shared DevMail database (engine_* tables).
name: devmail

services:
  db:
    image: postgres:18-bookworm
    container_name: devmail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devmail
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devmail"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  backend:
    build:
      context: ./backend
    image: devmail-api:latest
    container_name: devmail-api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":7000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/devmail?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_ENV: production
      MAIL_ENGINE: ${MAIL_ENGINE:-sql}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
    volumes:
      - backups:/var/lib/devmail/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${PUBLIC_ORIGIN}/api/v1
    image: devmail-web:latest
    container_name: devmail-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge

  # --- Mail delivery tier -----------------------------------------------------
  # Inbound SMTP (25), authenticated submission (587/465) and IMAP over TLS
  # (993). Postfix reads virtual domains/mailboxes/aliases from the engine_*
  # tables, signs with OpenDKIM, and delivers to Dovecot over LMTP. TLS material
  # is mounted from ./mail-tls (the Let's Encrypt certificate Caddy already
  # holds for mail.<domain>).
  postfix:
    build:
      context: ./deploy/mail/postfix
    image: devmail-postfix:latest
    container_name: devmail-postfix
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.devhubinc.com}
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.devhubinc.com}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-devhubinc.com}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: devmail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_TLS_CERT_FILE: /etc/ssl/private/mail.pem
      MAIL_TLS_KEY_FILE: /etc/ssl/private/mail.key
    volumes:
      - mail-sockets:/var/spool/postfix/private
      - ./mail-tls:/etc/ssl/private
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    depends_on:
      db:
        condition: service_healthy
      opendkim:
        condition: service_started
    networks:
      - internal

  dovecot:
    build:
      context: ./deploy/mail/dovecot
    image: devmail-dovecot:latest
    container_name: devmail-dovecot
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.devhubinc.com}
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.devhubinc.com}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: devmail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_TLS_CERT_FILE: /etc/ssl/private/mail.pem
      MAIL_TLS_KEY_FILE: /etc/ssl/private/mail.key
    volumes:
      - mail-sockets:/var/spool/postfix/private
      - ./mail-tls:/etc/ssl/private
      - vmail:/var/mail/vmail
    ports:
      - "993:993"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  opendkim:
    build:
      context: .
      dockerfile: deploy/mail/opendkim/Dockerfile
    image: devmail-opendkim:latest
    container_name: devmail-opendkim
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/devmail?sslmode=disable
      SECRET_KEY: ${SECRET_KEY}
      DKIM_DIR: /etc/opendkim/keys
    volumes:
      - dkim-keys:/etc/opendkim/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
  edge:
    external: true
    name: taskpart

volumes:
  db-data:
  backups:
  mail-sockets:
  vmail:
  dkim-keys:
