# Production stack for a host that sits behind a shared edge proxy (Caddy).
# Publishes no host ports: the proxy reaches these containers by name over the
# external "taskpart" Docker network. Bring up from the repo root:
#
#   docker compose -f compose.vps.yml up -d --build
#
# Secrets come from .env in this directory (see .env.example).
name: devmail

services:
  db:
    image: postgres:18-bookworm
    container_name: devmail-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devmail
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devmail"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal

  backend:
    build:
      context: ./backend
    image: devmail-api:latest
    container_name: devmail-api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":7000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/devmail?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_ENV: production
      MAIL_ENGINE: ${MAIL_ENGINE:-sql}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
    volumes:
      - backups:/var/lib/devmail/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${PUBLIC_ORIGIN}/api/v1
    image: devmail-web:latest
    container_name: devmail-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edge

networks:
  internal:
  edge:
    external: true
    name: taskpart

volumes:
  db-data:
  backups:
