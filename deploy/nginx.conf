server {
  listen 80;
  client_max_body_size 1m;
  location /api/ {
    proxy_pass http://backend:7000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 310s;
  }
  location /metrics {
    proxy_pass http://backend:7000;
    proxy_set_header Host $host;
  }
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
