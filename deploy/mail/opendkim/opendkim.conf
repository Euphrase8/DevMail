# DevMail OpenDKIM configuration.
Syslog                  no
LogWhy                  yes
Canonicalization        relaxed/relaxed
Mode                    sv
SubDomains              no
AutoRestart             yes
AutoRestartRate         10/1h
SignatureAlgorithm      rsa-sha256
OversignHeaders         From

# Internal hosts are the container network ranges that our Postfix runs in;
# messages from them are signed, messages from anywhere else are only verified.
InternalHosts           172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8

# Tables are regenerated by devmail-tools dkim-export into the dkim-keys volume.
KeyTable                /etc/opendkim/keys/KeyTable
SigningTable            /etc/opendkim/keys/SigningTable
Selector                default

Socket                  inet:8891@0.0.0.0
PidFile                 /run/opendkim/opendkim.pid
UMask                   007
UserID                  opendkim