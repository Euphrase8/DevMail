# Argon2 verification needs a generous virtual-memory limit (libsodium).
service auth {
  vsz_limit = 2G
  user = dovecot

  # Socket Postfix uses for SMTP AUTH. Mode 0666 keeps the stack working
  # regardless of differing uid/gid numbering between the two base images;
  # the volume is only mounted into the postfix and dovecot containers.
  unix_listener /var/spool/postfix/private/auth {
    mode = 0666
  }
}

service lmtp {
  # Socket Postfix uses for local delivery (virtual_transport).
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0666
  }
}

service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}