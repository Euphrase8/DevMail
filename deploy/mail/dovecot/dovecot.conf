protocols = imap lmtp
listen = *

# Maildir storage owned by the vmail user (uid/gid 5000).
mail_location = maildir:/var/mail/vmail/%d/%n
mail_uid = 5000
mail_gid = 5000
maildir_stat_dirs = yes

# IMAP over TLS only (port 993).
ssl = required
ssl_cert = </etc/ssl/private/mail.pem
ssl_key = </etc/ssl/private/mail.key

# SMTP AUTH via Postfix uses PLAIN over TLS; LMTP delivery is unauthenticated.
auth_mechanisms = plain login
disable_plaintext_auth = no

postmaster_address = postmaster@localhost

!include conf.d/10-master.conf
!include conf.d/10-auth.conf
!include conf.d/20-lmtp.conf