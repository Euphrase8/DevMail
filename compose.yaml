services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
      POSTGRES_DB: devmail
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devmail"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/devmail?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in an untracked .env file}
      APP_ENV: ${APP_ENV:-development}
      MAIL_ENGINE: ${MAIL_ENGINE:-sql}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/var/lib/devmail/backups
  frontend:
    build: ./frontend
    depends_on: [backend]
  gateway:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
  postfix:
    build: ./deploy/mail/postfix
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.localhost}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-localhost}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
      POSTGRES_DB: devmail
      POSTGRES_HOST: postgres
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:-127.0.0.0/8}
      MAIL_TLS_CERT_FILE: /etc/ssl/private/mail.pem
      MAIL_TLS_KEY_FILE: /etc/ssl/private/mail.key
    depends_on:
      postgres:
        condition: service_healthy
      opendkim:
        condition: service_started
    volumes:
      - mail-sockets:/var/spool/postfix/private
      - mail-certs:/etc/ssl/private
    ports:
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSION_PORT:-587}:587"
      - "${SMTPS_PORT:-465}:465"
  dovecot:
    build: ./deploy/mail/dovecot
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.localhost}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
      POSTGRES_DB: devmail
      POSTGRES_HOST: postgres
      MAIL_TLS_CERT_FILE: /etc/ssl/private/mail.pem
      MAIL_TLS_KEY_FILE: /etc/ssl/private/mail.key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mail-sockets:/var/spool/postfix/private
      - mail-certs:/etc/ssl/private
      - vmail:/var/mail/vmail
    ports:
      - "${IMAPS_PORT:-993}:993"
  opendkim:
    build:
      context: .
      dockerfile: deploy/mail/opendkim/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/devmail?sslmode=disable
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in an untracked .env file}
      DKIM_DIR: /etc/opendkim/keys
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dkim-keys:/etc/opendkim/keys
volumes:
  postgres-data:
  backups:
  mail-sockets:
  mail-certs:
  vmail:
  dkim-keys:
