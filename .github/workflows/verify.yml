name: Verify DevMail
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-development-only
          POSTGRES_DB: devmail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d devmail_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend unit, HTTP and PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-development-only@127.0.0.1:5432/devmail_test?sslmode=disable
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc --noEmit
          npm run build
      - name: Validate container wiring
        env:
          POSTGRES_PASSWORD: ci-development-only
          SECRET_KEY: ci-only-encryption-key-for-container-config
        run: docker compose config --quiet
