name: Deploy to VPS

# Every push to main ships the new code to the live stack at
# https://mail.devhubinc.com. The build runs on the VPS with Docker layer
# caching, so only the services whose source actually changed are rebuilt
# (a frontend-only change usually completes well under a minute).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart the VPS stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: SHA256:7VCm1c9KaGU3fYo7JeRFu2CoOgA7lUSybN4ctmgcUM4
          command_timeout: 15m
          script_stop: true
          script: |
            set -eu
            cd /opt/devmail
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose -f compose.vps.yml up -d --build --remove-orphans
            docker image prune -f
            echo "Deployed $(git rev-parse --short HEAD)"
